# Module ownership for the Contribution Table (tools/contribution_table.py).
# Each module has one owner and one or more path globs. Commits are counted with
# git log --use-mailmap --no-merges over the paths, reachable from main only.

modules:
  shared_config:
    owner: Anas
    paths:
      - src/signbridge/config.py
      - src/signbridge/logging_setup.py
      - configs/data.yaml

  project:
    owner: Anas
    paths:
      - .github/**
      - .gitignore
      - .mailmap
      - pyproject.toml
      - requirements.txt
      - requirements-core.txt
      - requirements-dev.txt
      - requirements-ml.txt
      - src/signbridge/__init__.py

  readme:
    owner: Shared
    paths:
      - README.md

  protocol:
    owner: Aliza
    paths:
      - docs/data_collection_protocol.md

  download:
    owner: Anas
    paths:
      - data_scripts/download_data.py

  cleaning:
    owner: Aliza
    paths:
      - data_scripts/clean/**

  raw_eda:
    owner: Aliza
    paths:
      - data_scripts/eda/raw_data_eda.py

  landmarks:
    owner: Fatima
    paths:
      - data_scripts/features/extract.py
      - data_scripts/features/landmarks.py
      - data_scripts/eda/feature_eda.py
      - data/processed/landmark_detections_split.csv
      - reports/figures/landmark_detection_by_split.csv
      - reports/figures/detection_rate_per_class.csv
      - reports/figures/detection_rate_per_class.png
      - src/signbridge/inference/landmark_predictor.py
      - src/signbridge/inference/overlay.py
      - tests/test_landmark_predictor.py
      - tests/test_overlay.py
      - docs/report/sections/landmark_inference.tex

  labels_and_images:
    owner: Fatima
    paths:
      - data_scripts/features/labels.py
      - data_scripts/features/images.py
      - data/processed/label_map.json

  manifest:
    owner: Aliza
    paths:
      - data_scripts/build_manifest.py

  splits:
    owner: Aliza
    paths:
      - src/signbridge/data/splits.py
      - data_scripts/build_split_pool.py
      - data/processed/split_v1.csv
      - reports/split_pool_summary.csv

  evaluation:
    owner: Aliza
    paths:
      - src/signbridge/evaluation/**
      - src/signbridge/evaluation/sample_predictions.py
      - tests/test_sample_predictions.py
      - reports/figures/sample_predictions.csv
      - reports/figures/sample_predictions.png
      - reports/metrics/cnn_*
      - reports/metrics/landmark_*_test_common_*
      - reports/bias/**
      - reports/errors/**
      - reports/figures/cnn_test_*
      - docs/report/sections/error_analysis.tex
      - docs/report/sections/bias_check.tex

  landmark_models:
    owner: Fatima
    paths:
      - src/signbridge/models/landmark_models.py
      - src/signbridge/train_landmark.py
      - src/signbridge/tune_landmark.py
      - src/signbridge/plot_landmark_curves.py
      - src/signbridge/training/landmark_trials.py
      - configs/landmark.yaml
      - reports/tuning/landmark_trials.csv
      - reports/tuning/mlp_history.csv
      - reports/figures/landmark_mlp_curves.png
      - reports/metrics/landmark_val_*
      - reports/metrics/landmark_test_*
      - reports/predictions/landmark_*
      - docs/report/sections/phase3_landmark.tex
      - docs/report/sections/landmark_hyperparameters.tex

  cnn_model:
    owner: Anas
    paths:
      - src/signbridge/models/cnn.py
      - src/signbridge/models/__init__.py
      - src/signbridge/data/__init__.py
      - src/signbridge/data/image_dataset.py
      - src/signbridge/data/transforms.py
      - configs/cnn.yaml

  cnn_training:
    owner: Anas
    paths:
      - src/signbridge/training/**
      - src/signbridge/train_cnn.py
      - src/signbridge/preflight.py

  cnn_tuning:
    owner: Anas
    paths:
      - src/signbridge/tune_cnn.py

  inference:
    owner: Anas
    paths:
      - src/signbridge/inference/**
      - src/signbridge/app_config.py
      - src/signbridge/app_service.py
      - src/signbridge/predict.py
      - app/**
      - configs/app.yaml
      - tests/test_app.py
      - tests/test_app_config.py
      - tests/test_app_service.py
      - tests/test_predict.py
      - tests/test_cnn_predictor.py
      - tests/test_inference_interface.py
      - docs/report/sections/inference_app.tex

  tools:
    owner: Anas
    paths:
      - tools/**
      - configs/modules.yaml

  report:
    owner: Anas
    paths:
      - docs/report/**
      - reports/**

  tests:
    owner: Shared
    paths:
      - tests/**
