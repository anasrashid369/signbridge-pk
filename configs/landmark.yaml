# configs/landmark.yaml
# Settings for the landmark models (SVM, Random Forest, MLP).
# Seeds, the split file, the label map and data paths come from configs/data.yaml.
# All paths below are relative to the repository root.
# The model settings below are the winners of the validation-only search
# (reports/tuning/landmark_trials.csv): svm-14, forest-06 and mlp-16.

# --- Input -------------------------------------------------------------
input_dim: 63                 # 21 landmarks x (x, y, z), normalised by the wrist
n_classes: 26                 # A-Z, class order from data/processed/label_map.json

# --- SVM ---------------------------------------------------------------
svm:
  C: 100                      # regularisation: larger C fits the training data harder (svm-14)
  gamma: 0.01                 # RBF kernel width: "scale" or a positive number (svm-14)
  # Probabilities are produced through CalibratedClassifierCV.

# --- Random Forest -----------------------------------------------------
forest:
  n_estimators: 300           # number of trees (forest-06)
  max_depth: 20               # null = grow until pure; an integer limits overfitting (forest-06)

# --- MLP (PyTorch) -----------------------------------------------------
mlp:
  hidden_size: 256            # units in each hidden layer (mlp-16)
  n_hidden_layers: 2          # number of hidden layers
  dropout: 0.1                # dropout probability after each hidden layer (mlp-16)
  learning_rate: 0.003        # AdamW learning rate (mlp-16)
  weight_decay: 0.0001        # AdamW weight decay (mlp-16)
  batch_size: 64              # samples per gradient step (mlp-16)
  epochs: 100                 # upper limit; early stopping usually ends sooner
  patience: 10                # stop after this many epochs without validation macro-F1 gain

# --- Tuning (validation split ONLY, never the test split) ---------------
tuning:
  trials_csv: reports/tuning/landmark_trials.csv   # one row per trial
  svm_C: [0.1, 1, 10, 100]                         # 4 x 4 = 16 SVM trials (full grid)
  svm_gamma: [scale, 0.01, 0.1, 1]
  forest_n_estimators: [100, 300, 500]             # 3 x 3 = 9 forest trials (full grid)
  forest_max_depth: [null, 10, 20]
  mlp_learning_rate: [0.0003, 0.001, 0.003]        # 3^5 = 243 MLP combinations ...
  mlp_batch_size: [32, 64, 128]
  mlp_dropout: [0.1, 0.3, 0.5]
  mlp_hidden_size: [64, 128, 256]
  mlp_weight_decay: [0.0, 0.0001, 0.001]
  mlp_max_trials: 20                               # ... of which this many are sampled (seeded)

# --- Outputs -----------------------------------------------------------
output:
  predictions_dir: reports/predictions             # FINAL val/test prediction files (committed)
  runs_dir: reports/predictions/runs               # scratch and tuning runs (ignored by Git)
  history_csv: reports/tuning/mlp_history.csv      # per-epoch loss/accuracy of the final MLP run
  model_dir: models/landmark                       # saved models (NOT committed)